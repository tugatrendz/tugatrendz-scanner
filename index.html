* {
  box-sizing:border-box;
}


html,
body {
  margin:0;

}


body {

  min-height:100vh;

/* BOTÕES */

button {

  width:100%;

  padding:16px;

  margin-top:14px;

  border:0;

  border-radius:15px;

  background:

      180deg,
      #191919,
      #050505

  color:white;

  font-weight:900;

  cursor:pointer;

}


button:active {

  transform:
    scale(.985);

}


button.green {

  background:

      180deg,
      #1b914b,

    );

button.secondary {

  color:#333;

}


button:disabled {

}


.cameraFrame {

  position:relative;

  overflow:hidden;

  margin-top:21px;

  border-radius:22px;

  background:#050505;

  box-shadow:

}


video {

  display:block;

  width:100%;

  height:auto;

}


.overlay {

  position:absolute;

  inset:0;

  pointer-events:none;

}


.scanSquare {

  position:absolute;

  width:64%;

  aspect-ratio:1/1;

  top:50%;

  left:18%;

  transform:
    translateY(-50%);

  border-radius:20px;

  border:
    2px solid
    rgba(255,255,255,.88);

  box-shadow:
    0 0 0
    9999px
    rgba(0,0,0,.30);

}


.scanSquare:before,
.scanSquare:after {

  content:"";

  position:absolute;

  width:32px;

  height:32px;

  border-color:white;

}


.scanSquare:before {

  left:-3px;

  top:-3px;

  border-left:
    4px solid white;

  border-top:
    4px solid white;

  border-radius:
    10px 0 0 0;

}


.scanSquare:after {

  right:-3px;

  bottom:-3px;

  border-right:
    4px solid white;

  border-bottom:
    4px solid white;

  border-radius:
    0 0 10px 0;

}


.scannerHint {

  position:absolute;

  left:0;

  right:0;

  bottom:17px;

  color:white;

  font-size:10px;

  letter-spacing:1px;

  text-align:center;

  text-shadow:
    0 2px 5px
    rgba(0,0,0,.7);

}


canvas {

  display:none;

}


/* RESULTADO */

#resultado {

  margin-top:19px;

}


.status {

  padding:
    14px 15px;

  border-radius:14px;

  background:#f5f5f5;

  color:#666;

  text-align:center;

  font-size:12px;

  line-height:1.5;

}


.status.ok {

}


.status.error {

}


/* OFERTA */

.offer {

  padding:
    23px 19px;

  border:
    1px solid #ececec;

  border-radius:20px;

  background:
    linear-gradient(

}


.offerIcon {

  width:58px;

  height:58px;

  align-items:center;

  justify-content:center;

}


.offerState {

}


.offerRestaurant {

.offerBenefit {

}


.offerCode {

}


.visit {

.footer {

}


@media(max-width:480px) {

    padding:
      21px 14px

  }

  }

  .card {

    border-radius:25px;

  }

<div class="app">


<div class="header">


<img
class="logo"
src="https://tugatrendz.github.io/tugatrendz-scanner/logo.png?v=20260813"
alt="TugaTrendz">


<div class="partnerBadge">
PARTNERS
</div>


<div
id="nomeRestaurante"
class="restaurant">

Portal de parceiros

</div>


</div>



<div class="card">


<!-- LOGIN -->

<div id="loginArea">


<div class="title">
Acesso profissional
</div>

Introduz o PIN atribuído ao estabelecimento

id="botaoAbrir"
onclick="abrirCamara()">

📷 INICIAR SCANNER

</button>

id="cameraBox"
class="cameraFrame hidden">

id="video"
autoplay
muted
playsinline>
</video>

APONTA PARA O QR CODE
</div>

</div>


</div>

</div>

<div class="footer">

TUGATRENDZ PARTNERS · VALIDATION SYSTEM

</div>

<script>

// ========================================================
// APPS SCRIPT
// ========================================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyIH5DXiwubtkRrscwGybkECXhBHI6FSabCt4p8-1EjD3EIfZE93hq2wWfkKJL-e_mrUQ/exec";



// ========================================================
// RESTAURANTE
// ========================================================

const parametros =
  new URLSearchParams(
    location.search
  );


const restauranteId =
  parametros.get("restaurante")
  || "R001";



// ========================================================
// ESTADO
// ========================================================

let pinRestaurante =
  localStorage.getItem(
    "tugatrendz_pin_" +
    restauranteId
  );


let stream = null;

let cameraAberta = false;

let detecaoAtiva = false;

let processamento = false;

let codigoAtual = null;

let frameId = null;

let ultimoFrame = 0;

let ultimoQr = "";

let ultimoQrTempo = 0;


const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const ctx =
  canvas.getContext(
    "2d",
    {
      willReadFrequently:true
    }
  );



// ========================================================
// JSONP
// ========================================================

function jsonp(params) {

  return new Promise(
    function(resolve, reject) {


      const callback =
        "tg_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error("Timeout")
            );

          },
          15000
        );



      function cleanup() {

        clearTimeout(timeout);

        try {
          delete window[callback];
        }
        catch(e) {}

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }



      window[callback] =
        function(data) {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          resolve(data);

        };



      const query =
        new URLSearchParams(params);


      query.set(
        "callback",
        callback
      );


      query.set(
        "_",
        Date.now()
      );


      script.src =
        APPS_SCRIPT_URL +
        "?" +
        query.toString();


      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(
            new Error("Ligação")
          );

        };


      document.body.appendChild(
        script
      );

    }
  );
}



// ========================================================
// LOGIN
// ========================================================

async function entrar() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    erroGeral(
      "Introduz o PIN."
    );

    return;
  }


  const botao =
    document.getElementById(
      "botaoEntrar"
    );


  botao.disabled = true;


  status(
    "A validar acesso...",
    ""
  );


  try {

    const resposta =
      await jsonp({

        api:"pin",

        restaurante:
          restauranteId,

        pin:pin

      });


    if (!resposta.ok) {

      erroGeral(
        resposta.mensagem ||
        "PIN inválido."
      );

      botao.disabled = false;

      return;
    }


    pinRestaurante = pin;


    localStorage.setItem(

      "tugatrendz_pin_" +
      restauranteId,

      pin

    );


    entrarScanner(
      resposta.restaurante
    );

  }

  catch(e) {

    console.error(e);

    erroGeral(
      "Não foi possível ligar ao sistema."
    );

    botao.disabled = false;

  }
}



// ========================================================
// RECUPERAR SESSÃO
// ========================================================

async function recuperarSessao() {

  if (!pinRestaurante) {
    return;
  }


  try {

    const resposta =
      await jsonp({

        api:"pin",

        restaurante:
          restauranteId,

        pin:
          pinRestaurante

      });


    if (!resposta.ok) {

      localStorage.removeItem(

        "tugatrendz_pin_" +
        restauranteId

      );

      pinRestaurante = null;

      return;
    }


    entrarScanner(
      resposta.restaurante
    );

  }

  catch(e) {

    console.error(e);

  }
}



// ========================================================
// ENTRAR NO SCANNER
// ========================================================

function entrarScanner(restaurante) {

  document
    .getElementById(
      "nomeRestaurante"
    )
    .textContent =
    restaurante;


  document
    .getElementById(
      "loginArea"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "cameraArea"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "resultado"
    )
    .innerHTML =
    "";

}



// ========================================================
// ABRIR CÂMARA
// ========================================================

async function abrirCamara() {

  if (
    cameraAberta &&
    stream &&
    stream.active
  ) {

    processamento = false;

    detecaoAtiva = true;


    document
      .getElementById(
        "cameraBox"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "botaoAbrir"
      )
      .classList
      .add("hidden");


    iniciarLoop();

    return;
  }


  status(
    "A iniciar câmara...",
    ""
  );


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:false,

          video:{

            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          }

        });


    video.srcObject = stream;

    await video.play();


    cameraAberta = true;

    detecaoAtiva = true;

    processamento = false;


    document
      .getElementById(
        "botaoAbrir"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "cameraBox"
      )
      .classList
      .remove("hidden");


    status(
      "Scanner ativo · pronto para ler",
      "ok"
    );


    iniciarLoop();

  }

  catch(e) {

    console.error(e);


    let mensagem =
      "Não foi possível abrir a câmara.";


    if (
      e.name ===
      "NotAllowedError"
    ) {

      mensagem =
        "O acesso à câmara não foi autorizado. Verifica as permissões do navegador.";

    }

    else if (
      e.name ===
      "NotReadableError"
    ) {

      mensagem =
        "A câmara está ocupada por outra aplicação.";

    }

    else if (
      e.name ===
      "NotFoundError"
    ) {

      mensagem =
        "Não foi encontrada nenhuma câmara.";

    }


    erroGeral(mensagem);

  }
}



// ========================================================
// LOOP
// ========================================================

function iniciarLoop() {

  if (frameId) {

    cancelAnimationFrame(
      frameId
    );

    frameId = null;

  }


  function loop(timestamp) {

    if (
      !cameraAberta ||
      !stream
    ) {
      return;
    }


    if (
      timestamp -
      ultimoFrame >=
      140
    ) {

      ultimoFrame =
        timestamp;


      if (
        detecaoAtiva &&
        !processamento &&
        video.readyState >= 2 &&
        video.videoWidth > 0
      ) {

        analisar();

      }

    }


    frameId =
      requestAnimationFrame(
        loop
      );

  }


  frameId =
    requestAnimationFrame(
      loop
    );
}



// ========================================================
// ANALISAR QR
// ========================================================

function analisar() {

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  ctx.drawImage(

    video,

    0,
    0,

    canvas.width,
    canvas.height

  );


  const imagem =
    ctx.getImageData(

      0,
      0,

      canvas.width,
      canvas.height

    );


  const qr =
    jsQR(

      imagem.data,

      imagem.width,

      imagem.height,

      {
        inversionAttempts:
          "attemptBoth"
      }

    );


  if (
    !qr ||
    !qr.data
  ) {
    return;
  }


  const agora =
    Date.now();


  if (
    qr.data === ultimoQr &&
    agora - ultimoQrTempo < 3000
  ) {
    return;
  }


  ultimoQr =
    qr.data;


  ultimoQrTempo =
    agora;


  processarQR(
    qr.data
  );
}



// ========================================================
// PROCESSAR QR
// ========================================================

async function processarQR(texto) {

  if (processamento) {
    return;
  }


  processamento = true;

  detecaoAtiva = false;


  status(
    "A verificar oferta...",
    ""
  );


  const codigo =
    extrairCodigo(texto);


  if (!codigo) {

    erroScan(
      "Este QR Code não pertence à TugaTrendz."
    );

    return;
  }


  codigoAtual = codigo;


  try {

    const resposta =
      await jsonp({

        api:"validar",

        restaurante:
          restauranteId,

        pin:
          pinRestaurante,

        codigo:
          codigo

      });


    if (!resposta.ok) {

      erroScan(
        resposta.mensagem ||
        "Oferta inválida."
      );

      return;
    }


    mostrarOferta(
      resposta
    );

  }

  catch(e) {

    console.error(e);

    erroScan(
      "Não foi possível validar a oferta."
    );

  }
}



// ========================================================
// EXTRAIR CÓDIGO
// ========================================================

function extrairCodigo(texto) {

  const valor =
    String(texto || "")
      .trim();


  const match =
    valor.match(
      /TGT-[A-Z0-9]+/i
    );


  if (match) {

    return match[0]
      .toUpperCase();

  }


  try {

    const url =
      new URL(valor);


    const codigo =
      url.searchParams.get(
        "codigo"
      );


    if (codigo) {

      return codigo
        .trim()
        .toUpperCase();

    }

  }

  catch(e) {}


  return null;
}



// ========================================================
// MOSTRAR OFERTA
// ========================================================

function mostrarOferta(dados) {

  document
    .getElementById(
      "resultado"
    )
    .innerHTML = `

<div class="offer">


<div class="offerIcon">
✓
</div>


<div class="offerState">
OFERTA VÁLIDA
</div>


<div class="offerRestaurant">
${escapeHtml(dados.restaurante)}
</div>


<div class="offerBenefit">
🎁 ${escapeHtml(dados.oferta)}
</div>


<div class="offerCode">
${escapeHtml(dados.codigo)}
</div>


<button
class="green"
onclick="confirmarUtilizacao()">

CONFIRMAR UTILIZAÇÃO

</button>


<button
class="secondary"
onclick="proximoQR()">

CANCELAR

</button>


</div>

  `;
}



// ========================================================
// CONFIRMAR UTILIZAÇÃO
// ========================================================

async function confirmarUtilizacao() {

  if (!codigoAtual) {
    return;
  }


  status(
    "A registar visita...",
    ""
  );


  try {

    const resposta =
      await jsonp({

        api:"utilizar",

        restaurante:
          restauranteId,

        pin:
          pinRestaurante,

        codigo:
          codigoAtual

      });


    if (!resposta.ok) {

      erroScan(
        resposta.mensagem ||
        "Não foi possível confirmar."
      );

      return;
    }


    document
      .getElementById(
        "resultado"
      )
      .innerHTML = `

<div class="offer">


<div class="offerIcon">
✓
</div>


<div class="offerState">
UTILIZAÇÃO CONFIRMADA
</div>


<div class="offerRestaurant">
${escapeHtml(resposta.restaurante)}
</div>


<div class="visit">
Visita #${escapeHtml(resposta.visita)}
</div>


<div class="offerCode">
${escapeHtml(resposta.codigo)}
</div>


<button
onclick="proximoQR()">

📷 LER PRÓXIMO QR

</button>


</div>

    `;

  }

  catch(e) {

    console.error(e);

    erroScan(
      "Não foi possível registar a utilização."
    );

  }
}



// ========================================================
// PRÓXIMO QR
// ========================================================

function proximoQR() {

  codigoAtual = null;

  processamento = false;

  detecaoAtiva = true;

  ultimoQr = "";

  ultimoQrTempo = 0;


  document
    .getElementById(
      "cameraBox"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "botaoAbrir"
    )
    .classList
    .add("hidden");


  status(
    "Scanner ativo · pronto para o próximo QR.",
    "ok"
  );


  iniciarLoop();
}



// ========================================================
// STATUS
// ========================================================

function status(mensagem, tipo) {

  const classe =
    tipo === "ok"
    ? "status ok"
    : "status";


  document
    .getElementById(
      "resultado"
    )
    .innerHTML =
      '<div class="' +
      classe +
      '">' +
      escapeHtml(mensagem) +
      '</div>';
}



// ========================================================
// ERRO SCAN
// ========================================================

function erroScan(mensagem) {

  document
    .getElementById(
      "resultado"
    )
    .innerHTML = `

<div class="offer">


<div class="status error">

${escapeHtml(mensagem)}

</div>


<button
class="secondary"
onclick="proximoQR()">

📷 LER OUTRO QR

</button>


</div>

  `;
}



// ========================================================
// ERRO GERAL
// ========================================================

function erroGeral(mensagem) {

  document
    .getElementById(
      "resultado"
    )
    .innerHTML =
      '<div class="status error">' +
      escapeHtml(mensagem) +
      '</div>';
}



// ========================================================
// ESCAPAR HTML
// ========================================================

function escapeHtml(texto) {

  return String(
    texto === undefined ||
    texto === null
    ? ""
    : texto
  )

  .replace(/&/g, "&amp;")

  .replace(/</g, "&lt;")

  .replace(/>/g, "&gt;")

  .replace(/"/g, "&quot;")

  .replace(/'/g, "&#039;");
}



// ========================================================
// PARAR CÂMARA SÓ QUANDO SAIR DA PÁGINA
// ========================================================

window.addEventListener(
  "pagehide",
  function() {

    if (!stream) {
      return;
    }

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );

  }
);



// ========================================================
// INICIAR
// ========================================================

recuperarSessao();

</script>
