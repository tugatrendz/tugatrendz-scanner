<!DOCTYPE html>
<html lang="pt-PT">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TugaTrendz - Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: auto;
    background: white;
    border-radius: 20px;
    padding: 25px 20px 30px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.logo {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 5px;
}

.subtitulo {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 25px;
}

.instrucao {
    color: #666;
    margin-bottom: 20px;
}

#reader {
    width: 100%;
    margin: auto;
}

.estado {
    margin-top: 20px;
    font-size: 16px;
    line-height: 1.5;
}

.erro {
    color: #d93025;
    font-weight: bold;
}

.sucesso {
    color: #16803c;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

</style>

</head>


<body>

<div class="container">

    <div class="logo">
        🔥 TugaTrendz
    </div>

    <div class="subtitulo">
        Scanner de ofertas
    </div>

    <p class="instrucao">
        Aponta a câmara para o QR Code apresentado pelo cliente.
    </p>

    <div id="reader"></div>

    <div id="estado"
         class="estado">
        Carrega no botão para iniciar.
    </div>

    <button
        id="botaoCamara"
        onclick="iniciarScanner()">
        📷 ABRIR CÂMARA
    </button>

</div>


<script>

// =====================================================
// CONFIGURAÇÃO
// =====================================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbvIH5DXiwubtKRscwGybkECXhBHI6FSabCt4p8-1EjD3ElfZE93hq2wWfkKJL-e_mrUQ/exec";



// =====================================================
// VARIÁVEIS
// =====================================================

let scanner = null;

let scannerAtivo = false;

let codigoJaLido = false;



// =====================================================
// PARAR SCANNER
// =====================================================

async function pararScanner() {

    if (!scanner) {
        return;
    }

    try {

        if (scannerAtivo) {
            await scanner.stop();
        }

    }
    catch (erro) {

        console.log(
            "Erro ao parar scanner:",
            erro
        );

    }

    scannerAtivo = false;


    try {

        await scanner.clear();

    }
    catch (erro) {

        console.log(
            "Erro ao limpar scanner:",
            erro
        );

    }

}



// =====================================================
// INICIAR SCANNER
// =====================================================

async function iniciarScanner() {

    if (scannerAtivo) {
        return;
    }


    codigoJaLido = false;


    document
        .getElementById("botaoCamara")
        .style.display = "none";


    document
        .getElementById("estado")
        .innerHTML =
        "📷 A abrir a câmara...";


    try {


        if (scanner) {

            try {
                await scanner.clear();
            }
            catch (erro) {}

        }


        scanner =
            new Html5Qrcode("reader");


        await scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },


            async function(decodedText) {


                if (codigoJaLido) {
                    return;
                }


                codigoJaLido = true;


                document
                    .getElementById("estado")
                    .innerHTML =

                    "<span class='sucesso'>" +
                    "✅ QR Code encontrado." +
                    "</span>" +

                    "<br><br>" +

                    "A abrir oferta...";


                // Esperar que a câmara seja libertada
                await pararScanner();


                // Pequena pausa adicional
                await new Promise(
                    resolve =>
                        setTimeout(resolve, 700)
                );


                processarQR(decodedText);

            },


            function(errorMessage) {

                // Ignorar erros normais durante leitura

            }

        );


        scannerAtivo = true;


        document
            .getElementById("estado")
            .innerHTML =

            "<span class='sucesso'>" +
            "🟢 Câmara pronta" +
            "</span>" +

            "<br>" +

            "Aponta para o QR Code.";

    }

    catch (erro) {


        scannerAtivo = false;


        console.error(erro);


        let mensagem =
            "❌ Não foi possível abrir a câmara.";


        const textoErro =
            String(erro || "");


        if (
            textoErro.includes("NotReadableError") ||
            textoErro.includes("Could not start video source")
        ) {

            mensagem =

                "⚠️ A câmara ainda está ocupada." +

                "<br><br>" +

                "Espera 2 segundos e tenta novamente.";

        }


        if (
            textoErro.includes("NotAllowedError") ||
            textoErro.includes("Permission")
        ) {

            mensagem =

                "❌ O acesso à câmara não foi autorizado." +

                "<br><br>" +

                "Verifica as permissões do navegador.";

        }


        document
            .getElementById("estado")
            .innerHTML =

            "<span class='erro'>" +
            mensagem +
            "</span>";


        document
            .getElementById("botaoCamara")
            .style.display = "block";

    }

}



// =====================================================
// PROCESSAR QR
// =====================================================

function processarQR(decodedText) {

    let codigo = "";

    const texto =
        String(decodedText).trim();


    // =================================================
    // 1. PROCURAR DIRETAMENTE UM CÓDIGO TGT-
    //
    // Isto faz com que ignoremos qualquer
    // URL antigo que possa estar dentro do QR.
    // =================================================

    const match =
        texto.match(/TGT-[A-Z0-9]+/i);


    if (match) {

        codigo =
            match[0].toUpperCase();

    }


    else {

        // =================================================
        // 2. TENTAR LER COMO URL
        // =================================================

        try {

            const url =
                new URL(texto);


            codigo =
                url.searchParams.get("codigo") || "";

        }

        catch (erro) {

            codigo = texto;

        }

    }


    codigo =
        codigo
            .trim()
            .toUpperCase();


    // =================================================
    // VERIFICAÇÃO FINAL
    // =================================================

    if (
        !codigo ||
        !codigo.startsWith("TGT-")
    ) {


        document
            .getElementById("estado")
            .innerHTML =

            "<span class='erro'>" +

            "❌ Este QR Code não é uma oferta TugaTrendz." +

            "</span>";


        document
            .getElementById("botaoCamara")
            .style.display = "block";


        codigoJaLido = false;


        return;

    }


    // =================================================
    // CONSTRUIR SEMPRE UM URL NOVO
    //
    // Nunca usamos o endereço que estiver
    // dentro do próprio QR.
    // =================================================

    const destino =

        APPS_SCRIPT_URL +

        "?acao=validar&codigo=" +

        encodeURIComponent(codigo);


    console.log(
        "Código detetado:",
        codigo
    );


    console.log(
        "Destino:",
        destino
    );


    window.location.href =
        destino;

}



// =====================================================
// LIBERTAR CÂMARA SE SAIRMOS DA PÁGINA
// =====================================================

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden &&
            scannerAtivo
        ) {

            pararScanner();

        }

    }
);



window.addEventListener(
    "pagehide",
    function() {

        if (scannerAtivo) {

            pararScanner();

        }

    }
);



// =====================================================
// IMPORTANTE
//
// NÃO iniciamos automaticamente a câmara.
// O funcionário tem sempre de carregar
// em "ABRIR CÂMARA".
// =====================================================

</script>

</body>

</html>
