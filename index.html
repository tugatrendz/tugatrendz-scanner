<!DOCTYPE html>
<html lang="pt-PT">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TugaTrendz Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    text-align: center;
}

.box {
    width: 100%;
    max-width: 430px;
    margin: auto;
    background: white;
    padding: 25px 20px 30px;
    border-radius: 20px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.restaurante {
    margin-top: 7px;
    margin-bottom: 25px;
    font-size: 17px;
    font-weight: bold;
    color: #555;
}

input {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    font-size: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button.verde {
    background: #16803c;
}

button:disabled {
    opacity: .5;
}

#cameraArea {
    display: none;
}

.videoBox {
    width: 100%;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    background: #000;
    margin-top: 20px;
}

video {
    display: block;
    width: 100%;
    height: auto;
}

.mira {
    position: absolute;
    width: 62%;
    aspect-ratio: 1 / 1;

    left: 19%;
    top: 50%;
    transform: translateY(-50%);

    border: 3px solid white;
    border-radius: 14px;

    pointer-events: none;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.18);
}

canvas {
    display: none;
}

#resultado {
    margin-top: 20px;
    line-height: 1.6;
}

.sucesso {
    color: #16803c;
    font-weight: bold;
}

.erro {
    color: #d93025;
    font-weight: bold;
}

.oferta {
    background: #f6f6f6;
    border-radius: 15px;
    padding: 20px;
    margin-top: 20px;
}

.codigo {
    font-size: 21px;
    font-weight: bold;
    margin: 12px 0;
}

</style>

</head>


<body>

<div class="box">

    <div class="logo">
        🔥 TugaTrendz
    </div>

    <div
        id="nomeRestaurante"
        class="restaurante">

        Scanner de ofertas

    </div>


    <!-- LOGIN -->

    <div id="loginArea">

        <p>
            Introduza o PIN do restaurante.
        </p>

        <input
            id="pin"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            placeholder="PIN"
        >

        <button
            id="botaoEntrar"
            onclick="entrar()">

            ENTRAR

        </button>

    </div>


    <!-- CÂMARA -->

    <div id="cameraArea">

        <p>
            Aponta a câmara para o QR Code do cliente.
        </p>

        <button
            id="botaoAbrir"
            onclick="abrirCamara()">

            📷 ABRIR CÂMARA

        </button>


        <div
            id="videoBox"
            class="videoBox"
            style="display:none;">

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <div class="mira"></div>

        </div>

        <canvas id="canvas"></canvas>

    </div>


    <div id="resultado"></div>

</div>



<script>

// ========================================================
// APPS SCRIPT
// ========================================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyIH5DXiwubtkRrscwGybkECxhBHI6FSabCt4p8-1EjD3EIfZE93hq2wWfkKJL-e_mrUQ/exec";



// ========================================================
// RESTAURANTE DO SCANNER
//
// Exemplo:
// ?restaurante=R001
// ========================================================

const parametros =
    new URLSearchParams(
        location.search
    );

const restauranteId =
    parametros.get("restaurante")
    || "R001";



// ========================================================
// ESTADO
// ========================================================

let pinRestaurante =
    localStorage.getItem(
        "tugatrendz_pin_" + restauranteId
    );

let stream = null;

let cameraAberta = false;

let detecaoAtiva = false;

let processamento = false;

let codigoAtual = null;

let animationFrameId = null;

let ultimoFrame = 0;

let ultimoQrLido = "";

let ultimoQrTempo = 0;


const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const contexto =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );



// ========================================================
// JSONP
//
// Comunica com o Apps Script sem navegar
// para outra página.
// ========================================================

function jsonp(parametros) {

    return new Promise(
        function(resolve, reject) {

            const callback =

                "tugaCallback_" +

                Date.now() +

                "_" +

                Math.floor(
                    Math.random() * 1000000
                );


            const script =
                document.createElement("script");


            let terminado = false;


            const timeout =
                setTimeout(
                    function() {

                        if (terminado) {
                            return;
                        }

                        terminado = true;

                        limpar();

                        reject(
                            new Error(
                                "Tempo esgotado"
                            )
                        );

                    },
                    15000
                );


            function limpar() {

                clearTimeout(timeout);

                try {
                    delete window[callback];
                }
                catch(e) {}


                if (script.parentNode) {

                    script.parentNode
                        .removeChild(script);

                }

            }


            window[callback] =
                function(dados) {

                    if (terminado) {
                        return;
                    }

                    terminado = true;

                    limpar();

                    resolve(dados);

                };


            const query =
                new URLSearchParams(
                    parametros
                );


            query.set(
                "callback",
                callback
            );


            query.set(
                "_",
                Date.now()
            );


            script.src =
                APPS_SCRIPT_URL +
                "?" +
                query.toString();


            script.onerror =
                function() {

                    if (terminado) {
                        return;
                    }

                    terminado = true;

                    limpar();

                    reject(
                        new Error(
                            "Erro de ligação"
                        )
                    );

                };


            document.body
                .appendChild(script);

        }
    );

}



// ========================================================
// LOGIN
// ========================================================

async function entrar() {

    const pin =
        document
            .getElementById("pin")
            .value
            .trim();


    if (!pin) {

        mostrarErro(
            "Introduza o PIN."
        );

        return;

    }


    const botao =
        document.getElementById(
            "botaoEntrar"
        );


    botao.disabled = true;


    document
        .getElementById("resultado")
        .innerHTML =
        "A validar PIN...";


    try {

        const resposta =
            await jsonp({

                api: "pin",

                restaurante:
                    restauranteId,

                pin:
                    pin

            });


        if (!resposta.ok) {

            mostrarErro(
                resposta.mensagem ||
                "PIN incorreto."
            );

            botao.disabled = false;

            return;

        }


        pinRestaurante =
            pin;


        localStorage.setItem(

            "tugatrendz_pin_" +
            restauranteId,

            pin

        );


        entrarNoScanner(
            resposta.restaurante
        );

    }

    catch(erro) {

        console.error(erro);

        mostrarErro(
            "Não foi possível ligar ao sistema."
        );

        botao.disabled = false;

    }

}



// ========================================================
// RECUPERAR PIN GUARDADO
// ========================================================

async function recuperarSessao() {

    if (!pinRestaurante) {
        return;
    }


    document
        .getElementById("resultado")
        .innerHTML =
        "A recuperar sessão...";


    try {

        const resposta =
            await jsonp({

                api: "pin",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante

            });


        if (!resposta.ok) {

            localStorage.removeItem(

                "tugatrendz_pin_" +
                restauranteId

            );

            pinRestaurante = null;

            document
                .getElementById("resultado")
                .innerHTML = "";

            return;

        }


        entrarNoScanner(
            resposta.restaurante
        );

    }

    catch(erro) {

        console.error(erro);

        document
            .getElementById("resultado")
            .innerHTML = "";

    }

}



// ========================================================
// MOSTRAR SCANNER
// ========================================================

function entrarNoScanner(nomeRestaurante) {

    document
        .getElementById(
            "nomeRestaurante"
        )
        .textContent =
        nomeRestaurante;


    document
        .getElementById(
            "loginArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "cameraArea"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "resultado"
        )
        .innerHTML = "";

}



// ========================================================
// ABRIR CÂMARA
//
// ESTE É O ÚNICO LOCAL ONDE PEDIMOS
// getUserMedia.
//
// Depois o stream fica aberto.
// ========================================================

async function abrirCamara() {

    // Já existe câmara aberta?
    // Não pedir novamente.

    if (
        cameraAberta &&
        stream &&
        stream.active
    ) {

        detecaoAtiva = true;

        processamento = false;

        iniciarLoop();

        return;

    }


    document
        .getElementById("resultado")
        .innerHTML =
        "📷 A abrir a câmara...";


    try {

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        cameraAberta = true;

        detecaoAtiva = true;

        processamento = false;


        document
            .getElementById(
                "botaoAbrir"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "videoBox"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "resultado"
            )
            .innerHTML =

            "<span class='sucesso'>" +

            "🟢 Câmara pronta" +

            "</span>" +

            "<br>" +

            "Aponta para o QR Code.";


        iniciarLoop();

    }

    catch(erro) {

        console.error(
            "Erro da câmara:",
            erro
        );


        cameraAberta = false;

        detecaoAtiva = false;


        let mensagem =
            "Não foi possível abrir a câmara.";


        if (
            erro &&
            erro.name === "NotAllowedError"
        ) {

            mensagem =
                "O acesso à câmara não foi autorizado. Verifica as permissões do navegador.";

        }


        else if (
            erro &&
            erro.name === "NotReadableError"
        ) {

            mensagem =
                "A câmara está ocupada por outra aplicação.";

        }


        else if (
            erro &&
            erro.name === "NotFoundError"
        ) {

            mensagem =
                "Não foi encontrada nenhuma câmara.";

        }


        mostrarErro(
            mensagem
        );

    }

}



// ========================================================
// LOOP DE LEITURA
// ========================================================

function iniciarLoop() {

    if (animationFrameId) {

        cancelAnimationFrame(
            animationFrameId
        );

        animationFrameId = null;

    }


    function loop(timestamp) {

        if (
            !cameraAberta ||
            !stream
        ) {

            animationFrameId = null;

            return;

        }


        // Não precisamos de processar
        // 60 frames por segundo.
        //
        // ~7 análises/segundo.

        if (
            timestamp - ultimoFrame >= 140
        ) {

            ultimoFrame = timestamp;


            if (
                detecaoAtiva &&
                !processamento &&
                video.readyState >= 2 &&
                video.videoWidth > 0 &&
                video.videoHeight > 0
            ) {

                analisarFrame();

            }

        }


        animationFrameId =
            requestAnimationFrame(
                loop
            );

    }


    animationFrameId =
        requestAnimationFrame(
            loop
        );

}



// ========================================================
// ANALISAR FRAME
// ========================================================

function analisarFrame() {

    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    contexto.drawImage(

        video,

        0,
        0,

        canvas.width,
        canvas.height

    );


    const frame =
        contexto.getImageData(

            0,
            0,

            canvas.width,
            canvas.height

        );


    const qr =
        jsQR(

            frame.data,

            frame.width,

            frame.height,

            {
                inversionAttempts:
                    "attemptBoth"
            }

        );


    if (
        !qr ||
        !qr.data
    ) {

        return;

    }


    const agora =
        Date.now();


    // Proteção contra leitura repetida
    // do mesmo QR.

    if (
        qr.data === ultimoQrLido &&
        agora - ultimoQrTempo < 3000
    ) {

        return;

    }


    ultimoQrLido =
        qr.data;


    ultimoQrTempo =
        agora;


    processarQR(
        qr.data
    );

}



// ========================================================
// PROCESSAR QR
//
// A CÂMARA NÃO FECHA.
// A PÁGINA NÃO MUDA.
// ========================================================

async function processarQR(textoQr) {

    if (processamento) {
        return;
    }


    processamento = true;

    detecaoAtiva = false;


    document
        .getElementById(
            "resultado"
        )
        .innerHTML =
        "🔎 A validar oferta...";


    const codigo =
        extrairCodigo(
            textoQr
        );


    if (!codigo) {

        mostrarErroScan(

            "Este QR não pertence à TugaTrendz."

        );

        return;

    }


    codigoAtual =
        codigo;


    try {

        const resposta =
            await jsonp({

                api: "validar",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante,

                codigo:
                    codigo

            });


        if (!resposta.ok) {

            mostrarErroScan(

                resposta.mensagem ||
                "Oferta inválida."

            );

            return;

        }


        mostrarOferta(
            resposta
        );

    }

    catch(erro) {

        console.error(erro);


        mostrarErroScan(

            "Não foi possível validar a oferta."

        );

    }

}



// ========================================================
// EXTRAIR CÓDIGO TGT-XXXXXX
// ========================================================

function extrairCodigo(texto) {

    const valor =
        String(texto || "")
            .trim();


    const encontrado =
        valor.match(
            /TGT-[A-Z0-9]+/i
        );


    if (encontrado) {

        return encontrado[0]
            .toUpperCase();

    }


    try {

        const url =
            new URL(valor);


        const codigo =
            url
                .searchParams
                .get("codigo");


        if (codigo) {

            return codigo
                .trim()
                .toUpperCase();

        }

    }

    catch(e) {}


    return null;

}



// ========================================================
// OFERTA VÁLIDA
// ========================================================

function mostrarOferta(dados) {

    document
        .getElementById(
            "resultado"
        )
        .innerHTML = `

        <div class="oferta">

            <div
                class="sucesso"
                style="font-size:22px;">

                🟢 OFERTA VÁLIDA

            </div>


            <br>


            <strong>

                ${escapeHtml(
                    dados.restaurante
                )}

            </strong>


            <br><br>


            🎁

            <strong>

                ${escapeHtml(
                    dados.oferta
                )}

            </strong>


            <br><br>


            <div class="codigo">

                ${escapeHtml(
                    dados.codigo
                )}

            </div>


            <button
                class="verde"
                onclick="confirmarUtilizacao()">

                ✅ CONFIRMAR UTILIZAÇÃO

            </button>


            <button
                onclick="proximoQR()">

                CANCELAR / LER OUTRO QR

            </button>

        </div>

    `;

}



// ========================================================
// CONFIRMAR
// ========================================================

async function confirmarUtilizacao() {

    if (!codigoAtual) {
        return;
    }


    document
        .getElementById(
            "resultado"
        )
        .innerHTML =
        "A registar utilização...";


    try {

        const resposta =
            await jsonp({

                api: "utilizar",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante,

                codigo:
                    codigoAtual

            });


        if (!resposta.ok) {

            mostrarErroScan(

                resposta.mensagem ||
                "Não foi possível registar a utilização."

            );

            return;

        }


        document
            .getElementById(
                "resultado"
            )
            .innerHTML = `

            <div class="oferta">

                <div
                    class="sucesso"
                    style="font-size:22px;">

                    ✅ OFERTA UTILIZADA

                </div>


                <br>


                Código:

                <strong>

                    ${escapeHtml(
                        resposta.codigo
                    )}

                </strong>


                <br><br>


                <strong>

                    Visita #${escapeHtml(
                        resposta.visita
                    )}

                </strong>


                <br>


                <button
                    onclick="proximoQR()">

                    📷 LER PRÓXIMO QR

                </button>

            </div>

        `;

    }

    catch(erro) {

        console.error(erro);


        mostrarErroScan(

            "Não foi possível registar a utilização."

        );

    }

}



// ========================================================
// PRÓXIMO QR
//
// NÃO SAI DA PÁGINA.
// NÃO FECHA A CÂMARA.
// NÃO PEDE OUTRA PERMISSÃO.
// ========================================================

function proximoQR() {

    codigoAtual = null;

    processamento = false;

    detecaoAtiva = true;

    ultimoQrLido = "";

    ultimoQrTempo = 0;


    document
        .getElementById(
            "resultado"
        )
        .innerHTML =

        "<span class='sucesso'>" +

        "🟢 Pronto para o próximo QR" +

        "</span>" +

        "<br>" +

        "Aponta para o próximo código.";

}



// ========================================================
// ERRO NUM QR
// ========================================================

function mostrarErroScan(mensagem) {

    document
        .getElementById(
            "resultado"
        )
        .innerHTML = `

        <div class="oferta">

            <div class="erro">

                ❌ ${escapeHtml(
                    mensagem
                )}

            </div>


            <button
                onclick="proximoQR()">

                📷 LER PRÓXIMO QR

            </button>

        </div>

    `;

}



// ========================================================
// ERRO GERAL
// ========================================================

function mostrarErro(mensagem) {

    document
        .getElementById(
            "resultado"
        )
        .innerHTML =

        "<span class='erro'>" +

        escapeHtml(mensagem) +

        "</span>";

}



// ========================================================
// ESCAPAR HTML
// ========================================================

function escapeHtml(valor) {

    return String(
        valor === undefined ||
        valor === null
            ? ""
            : valor
    )

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}



// ========================================================
// FECHAR CÂMARA SÓ QUANDO SAÍRES
// REALMENTE DESTA PÁGINA
// ========================================================

window.addEventListener(
    "pagehide",
    function() {

        if (!stream) {
            return;
        }


        stream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        cameraAberta = false;

        detecaoAtiva = false;

    }
);



// ========================================================
// INICIAR
// ========================================================

recuperarSessao();

</script>

</body>
</html>
