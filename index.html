<!DOCTYPE html>
<html lang="pt-PT">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TugaTrendz Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    text-align: center;
}

.box {
    max-width: 430px;
    margin: auto;
    background: white;
    padding: 25px 20px 30px;
    border-radius: 20px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.restaurante {
    margin-top: 6px;
    margin-bottom: 25px;
    font-size: 17px;
    font-weight: bold;
    color: #555;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button.verde {
    background: #16803c;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#cameraArea {
    display: none;
}

.videoBox {
    width: 100%;
    overflow: hidden;
    border-radius: 15px;
    background: #000;
    margin-top: 20px;
}

video {
    display: block;
    width: 100%;
    height: auto;
}

canvas {
    display: none;
}

#resultado {
    margin-top: 20px;
    line-height: 1.6;
}

.sucesso {
    color: #16803c;
    font-weight: bold;
}

.erro {
    color: #d93025;
    font-weight: bold;
}

.oferta {
    background: #f6f6f6;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}

.codigo {
    font-size: 20px;
    font-weight: bold;
    margin: 12px;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        🔥 TugaTrendz
    </div>

    <div id="nomeRestaurante"
         class="restaurante">
        Scanner de ofertas
    </div>


    <!-- LOGIN -->

    <div id="loginArea">

        <p>
            Introduza o PIN do restaurante.
        </p>

        <input
            id="pin"
            type="password"
            inputmode="numeric"
            placeholder="PIN"
        >

        <button
            id="botaoEntrar"
            onclick="entrar()">
            ENTRAR
        </button>

    </div>


    <!-- CÂMARA -->

    <div id="cameraArea">

        <p>
            Aponta a câmara para o QR Code do cliente.
        </p>

        <button
            id="botaoAbrir"
            onclick="abrirCamara()">
            📷 ABRIR CÂMARA
        </button>

        <div
            id="videoBox"
            class="videoBox"
            style="display:none;">

            <video
                id="video"
                autoplay
                playsinline
                muted>
            </video>

        </div>

        <canvas id="canvas"></canvas>

    </div>


    <div id="resultado"></div>

</div>


<script>

// ========================================================
// CONFIGURAÇÃO
// ========================================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyIH5DXiwubtkRrscwGybkECxhBHI6FSabCt4p8-1EjD3EIfZE93hq2wWfkKJL-e_mrUQ/exec";



// ========================================================
// RESTAURANTE
//
// Exemplo:
// ?restaurante=R001
// ========================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const restauranteId =
    params.get("restaurante") || "R001";



// ========================================================
// VARIÁVEIS
// ========================================================

let pinRestaurante =
    localStorage.getItem(
        "tugatrendz_pin_" + restauranteId
    );

let stream = null;

let cameraAberta = false;

let detecaoAtiva = false;

let processamento = false;

let codigoAtual = null;

let animationId = null;

let ultimoCodigo = null;

let ultimoCodigoTempo = 0;


const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );



// ========================================================
// JSONP
// Comunicação com Apps Script SEM sair desta página
// ========================================================

function jsonp(params) {

    return new Promise(
        function(resolve, reject) {

            const callback =
                "tgCallback_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random() * 100000
                );


            const script =
                document.createElement("script");


            let terminado = false;


            const timeout =
                setTimeout(
                    function() {

                        if (terminado) {
                            return;
                        }

                        terminado = true;

                        limpar();

                        reject(
                            new Error(
                                "Tempo esgotado."
                            )
                        );

                    },
                    12000
                );


            function limpar() {

                clearTimeout(timeout);

                try {
                    delete window[callback];
                }
                catch(e) {}

                if (script.parentNode) {

                    script.parentNode
                        .removeChild(script);

                }

            }


            window[callback] =
                function(dados) {

                    if (terminado) {
                        return;
                    }

                    terminado = true;

                    limpar();

                    resolve(dados);

                };


            const query =
                new URLSearchParams(params);


            query.set(
                "callback",
                callback
            );


            query.set(
                "_",
                Date.now()
            );


            script.src =
                APPS_SCRIPT_URL +
                "?" +
                query.toString();


            script.onerror =
                function() {

                    if (terminado) {
                        return;
                    }

                    terminado = true;

                    limpar();

                    reject(
                        new Error(
                            "Erro de ligação."
                        )
                    );

                };


            document.body.appendChild(script);

        }
    );

}



// ========================================================
// LOGIN
// ========================================================

async function entrar() {

    const pin =
        document
            .getElementById("pin")
            .value
            .trim();


    if (!pin) {

        mostrarErro(
            "Introduza o PIN."
        );

        return;

    }


    const botao =
        document.getElementById(
            "botaoEntrar"
        );


    botao.disabled = true;


    document
        .getElementById("resultado")
        .innerHTML =
        "A validar PIN...";


    try {

        const resposta =
            await jsonp({

                api: "pin",

                restaurante:
                    restauranteId,

                pin:
                    pin

            });


        if (!resposta.ok) {

            mostrarErro(
                resposta.mensagem ||
                "PIN incorreto."
            );

            botao.disabled = false;

            return;

        }


        pinRestaurante =
            pin;


        localStorage.setItem(

            "tugatrendz_pin_" +
            restauranteId,

            pin

        );


        abrirAreaScanner(
            resposta.restaurante
        );

    }

    catch(e) {

        console.error(e);

        mostrarErro(
            "Não foi possível ligar ao sistema."
        );

        botao.disabled = false;

    }

}



// ========================================================
// RECUPERAR LOGIN GUARDADO
// ========================================================

async function recuperarSessao() {

    if (!pinRestaurante) {
        return;
    }


    document
        .getElementById("resultado")
        .innerHTML =
        "A recuperar sessão...";


    try {

        const resposta =
            await jsonp({

                api: "pin",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante

            });


        if (!resposta.ok) {

            localStorage.removeItem(

                "tugatrendz_pin_" +
                restauranteId

            );

            pinRestaurante = null;

            document
                .getElementById("resultado")
                .innerHTML = "";

            return;

        }


        abrirAreaScanner(
            resposta.restaurante
        );

    }

    catch(e) {

        console.error(e);

        document
            .getElementById("resultado")
            .innerHTML = "";

    }

}



// ========================================================
// MOSTRAR ÁREA DO SCANNER
// ========================================================

function abrirAreaScanner(nome) {

    document
        .getElementById("nomeRestaurante")
        .textContent =
        nome || "TugaTrendz";


    document
        .getElementById("loginArea")
        .style.display =
        "none";


    document
        .getElementById("cameraArea")
        .style.display =
        "block";


    document
        .getElementById("resultado")
        .innerHTML = "";

}



// ========================================================
// ABRIR CÂMARA
//
// getUserMedia é chamado aqui.
// Depois NÃO fechamos a câmara entre QR Codes.
// ========================================================

async function abrirCamara() {

    // Se a câmara já estiver aberta,
    // NÃO pedimos novamente permissão.

    if (
        cameraAberta &&
        stream &&
        stream.active
    ) {

        processamento = false;

        detecaoAtiva = true;

        document
            .getElementById("botaoAbrir")
            .style.display =
            "none";


        document
            .getElementById("videoBox")
            .style.display =
            "block";


        document
            .getElementById("resultado")
            .innerHTML =

            "<span class='sucesso'>" +
            "🟢 Câmara pronta" +
            "</span>";


        iniciarDetecao();

        return;

    }


    document
        .getElementById("resultado")
        .innerHTML =
        "📷 A abrir a câmara...";


    try {

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio: false,

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        cameraAberta = true;

        detecaoAtiva = true;

        processamento = false;


        document
            .getElementById("botaoAbrir")
            .style.display =
            "none";


        document
            .getElementById("videoBox")
            .style.display =
            "block";


        document
            .getElementById("resultado")
            .innerHTML =

            "<span class='sucesso'>" +
            "🟢 Câmara pronta" +
            "</span>" +

            "<br>" +

            "Aponta para o QR Code.";


        iniciarDetecao();

    }

    catch(e) {

        console.error(
            "ERRO CÂMARA:",
            e
        );


        cameraAberta = false;

        detecaoAtiva = false;


        let mensagem =
            "Não foi possível abrir a câmara.";


        if (
            e &&
            e.name === "NotAllowedError"
        ) {

            mensagem =
                "O acesso à câmara foi recusado pelo navegador.";

        }


        else if (
            e &&
            e.name === "NotFoundError"
        ) {

            mensagem =
                "Não foi encontrada nenhuma câmara.";

        }


        else if (
            e &&
            e.name === "NotReadableError"
        ) {

            mensagem =
                "A câmara está a ser utilizada por outra aplicação.";

        }


        mostrarErro(
            mensagem
        );

    }

}



// ========================================================
// DETEÇÃO CONTÍNUA DE QR
// ========================================================

function iniciarDetecao() {

    if (animationId) {

        cancelAnimationFrame(
            animationId
        );

        animationId = null;

    }


    function tick() {

        if (
            !cameraAberta ||
            !stream
        ) {

            animationId = null;

            return;

        }


        if (
            detecaoAtiva &&
            !processamento &&
            video.readyState ===
            video.HAVE_ENOUGH_DATA &&
            video.videoWidth > 0 &&
            video.videoHeight > 0
        ) {

            canvas.width =
                video.videoWidth;


            canvas.height =
                video.videoHeight;


            ctx.drawImage(

                video,

                0,
                0,

                canvas.width,
                canvas.height

            );


            const imagem =
                ctx.getImageData(

                    0,
                    0,

                    canvas.width,
                    canvas.height

                );


            const qr =
                jsQR(

                    imagem.data,

                    imagem.width,

                    imagem.height,

                    {
                        inversionAttempts:
                            "attemptBoth"
                    }

                );


            if (
                qr &&
                qr.data
            ) {

                const agora =
                    Date.now();


                // Evitar ler o mesmo QR
                // várias vezes imediatamente.

                if (
                    qr.data !== ultimoCodigo ||
                    agora - ultimoCodigoTempo > 3000
                ) {

                    ultimoCodigo =
                        qr.data;


                    ultimoCodigoTempo =
                        agora;


                    qrLido(
                        qr.data
                    );

                }

            }

        }


        animationId =
            requestAnimationFrame(
                tick
            );

    }


    tick();

}



// ========================================================
// QR DETETADO
// ========================================================

async function qrLido(texto) {

    if (processamento) {
        return;
    }


    processamento = true;


    // MUITO IMPORTANTE:
    //
    // Só desligamos a DETEÇÃO.
    // NÃO paramos o vídeo.
    // NÃO paramos o MediaStream.
    // NÃO saímos da página.

    detecaoAtiva = false;


    document
        .getElementById("resultado")
        .innerHTML =
        "🔎 A validar oferta...";


    const codigo =
        extrairCodigo(texto);


    if (!codigo) {

        mostrarResultadoErro(
            "Este QR Code não é uma oferta TugaTrendz."
        );

        return;

    }


    codigoAtual =
        codigo;


    try {

        const resposta =
            await jsonp({

                api: "validar",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante,

                codigo:
                    codigo

            });


        if (!resposta.ok) {

            mostrarResultadoErro(

                resposta.mensagem ||
                "Oferta inválida."

            );

            return;

        }


        mostrarOferta(
            resposta
        );

    }

    catch(e) {

        console.error(e);


        mostrarResultadoErro(
            "Erro ao validar a oferta."
        );

    }

}



// ========================================================
// EXTRAIR TGT-XXXXXX DO QR
// ========================================================

function extrairCodigo(texto) {

    texto =
        String(texto || "")
            .trim();


    // Primeiro procura diretamente
    // TGT-XXXXXX dentro do conteúdo.

    const match =
        texto.match(
            /TGT-[A-Z0-9]+/i
        );


    if (match) {

        return match[0]
            .toUpperCase();

    }


    // Se for URL, tenta procurar
    // ?codigo=TGT-XXXXXX

    try {

        const url =
            new URL(texto);


        const codigo =
            url
                .searchParams
                .get("codigo");


        if (codigo) {

            return codigo
                .trim()
                .toUpperCase();

        }

    }

    catch(e) {}


    return null;

}



// ========================================================
// MOSTRAR OFERTA
// ========================================================

function mostrarOferta(dados) {

    document
        .getElementById("resultado")
        .innerHTML = `

        <div class="oferta">

            <div
                class="sucesso"
                style="font-size:22px;">

                🟢 OFERTA VÁLIDA

            </div>


            <br>


            <strong>
                ${escapeHtml(
                    dados.restaurante
                )}
            </strong>


            <br><br>


            🎁

            <strong>
                ${escapeHtml(
                    dados.oferta
                )}
            </strong>


            <br><br>


            <div class="codigo">
                ${escapeHtml(
                    dados.codigo
                )}
            </div>


            <button
                class="verde"
                onclick="confirmarUtilizacao()">

                ✅ CONFIRMAR UTILIZAÇÃO

            </button>


            <button
                onclick="proximoQR()">

                CANCELAR / LER OUTRO QR

            </button>

        </div>

    `;

}



// ========================================================
// CONFIRMAR UTILIZAÇÃO
// ========================================================

async function confirmarUtilizacao() {

    if (!codigoAtual) {
        return;
    }


    document
        .getElementById("resultado")
        .innerHTML =
        "A registar utilização...";


    try {

        const resposta =
            await jsonp({

                api: "utilizar",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante,

                codigo:
                    codigoAtual

            });


        if (!resposta.ok) {

            mostrarResultadoErro(

                resposta.mensagem ||
                "Não foi possível utilizar a oferta."

            );

            return;

        }


        document
            .getElementById("resultado")
            .innerHTML = `

            <div class="oferta">

                <div
                    class="sucesso"
                    style="font-size:22px;">

                    ✅ OFERTA UTILIZADA

                </div>


                <br>


                Código:

                <strong>
                    ${escapeHtml(
                        resposta.codigo
                    )}
                </strong>


                <br><br>


                <strong>
                    Visita #${escapeHtml(
                        resposta.visita
                    )}
                </strong>


                <br>


                <button
                    onclick="proximoQR()">

                    📷 LER PRÓXIMO QR

                </button>

            </div>

        `;

    }

    catch(e) {

        console.error(e);


        mostrarResultadoErro(
            "Não foi possível registar a utilização."
        );

    }

}



// ========================================================
// LER PRÓXIMO QR
//
// ESTA É A PARTE MAIS IMPORTANTE.
//
// NÃO:
// - fecha a página
// - fecha a câmara
// - chama getUserMedia novamente
// - pede nova autorização
//
// Apenas volta a ligar a deteção.
// ========================================================

function proximoQR() {

    codigoAtual = null;

    processamento = false;

    ultimoCodigo = null;

    ultimoCodigoTempo = 0;


    // Se o mesmo MediaStream continua vivo:

    if (
        stream &&
        stream.active &&
        cameraAberta
    ) {

        detecaoAtiva = true;


        document
            .getElementById("botaoAbrir")
            .style.display =
            "none";


        document
            .getElementById("videoBox")
            .style.display =
            "block";


        document
            .getElementById("resultado")
            .innerHTML =

            "<span class='sucesso'>" +

            "🟢 Pronto para o próximo QR" +

            "</span>" +

            "<br>" +

            "Aponta a câmara para o próximo código.";


        return;

    }


    // Só chegamos aqui se a câmara
    // tiver realmente sido encerrada
    // pelo browser/sistema.

    cameraAberta = false;

    detecaoAtiva = false;


    document
        .getElementById("botaoAbrir")
        .style.display =
        "block";


    document
        .getElementById("resultado")
        .innerHTML =

        "A sessão da câmara terminou. " +

        "Carrega em ABRIR CÂMARA.";

}



// ========================================================
// ERRO DURANTE LEITURA
// ========================================================

function mostrarResultadoErro(
    mensagem
) {

    document
        .getElementById("resultado")
        .innerHTML = `

        <div class="oferta">

            <div class="erro">

                ❌ ${escapeHtml(
                    mensagem
                )}

            </div>


            <button onclick="proximoQR()">

                📷 LER PRÓXIMO QR

            </button>

        </div>

    `;

}



// ========================================================
// ERRO NORMAL
// ========================================================

function mostrarErro(mensagem) {

    document
        .getElementById("resultado")
        .innerHTML =

        "<span class='erro'>" +

        escapeHtml(mensagem) +

        "</span>";

}



// ========================================================
// ESCAPAR HTML
// ========================================================

function escapeHtml(texto) {

    return String(
        texto === undefined ||
        texto === null
            ? ""
            : texto
    )

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



// ========================================================
// SÓ FECHAR A CÂMARA QUANDO A PÁGINA FOR REALMENTE FECHADA
// ========================================================

window.addEventListener(
    "pagehide",
    function() {

        if (!stream) {
            return;
        }


        stream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        cameraAberta = false;

        detecaoAtiva = false;

    }
);



// ========================================================
// ARRANQUE
// ========================================================

recuperarSessao();

</script>

</body>

</html>
