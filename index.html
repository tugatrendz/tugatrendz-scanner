<!DOCTYPE html>
<html lang="pt-PT">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#0b0b0b">

<title>TugaTrendz Partners</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;

    min-height:100vh;

    background:
        linear-gradient(
            180deg,
            #090909 0%,
            #111 100%
        );

    font-family:
        Arial,
        sans-serif;

    color:white;

}


.app {

    width:100%;

    max-width:480px;

    margin:auto;

    min-height:100vh;

    padding:
        26px 18px
        45px;

}


.top {

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:28px;

}


.brand {

    font-size:25px;

    font-weight:900;

    letter-spacing:-.8px;

}


.partner {

    padding:
        7px 10px;

    border-radius:999px;

    background:
        rgba(255,255,255,.08);

    color:#aaa;

    font-size:10px;

    letter-spacing:1.4px;

    font-weight:bold;

}


.restaurant {

    margin-bottom:20px;

    color:#bbb;

    font-size:14px;

}


.card {

    background:#fff;

    color:#111;

    border-radius:26px;

    padding:
        24px 20px
        28px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.3);

}


.sectionTitle {

    font-size:24px;

    font-weight:900;

    letter-spacing:-.7px;

}


.sectionSub {

    margin-top:7px;

    color:#777;

    font-size:13px;

    line-height:1.5;

}


input {

    width:100%;

    margin-top:22px;

    padding:16px;

    border:
        1px solid #ddd;

    border-radius:14px;

    text-align:center;

    font-size:20px;

    letter-spacing:5px;

    outline:none;

}


input:focus {

    border-color:#111;

}


button {

    width:100%;

    padding:16px;

    margin-top:14px;

    border:0;

    border-radius:14px;

    background:#111;

    color:#fff;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

}


button:active {

    transform:
        scale(.98);

}


button.green {

    background:#16803c;

}


button.secondary {

    background:#eee;

    color:#222;

}


button:disabled {

    opacity:.6;

}


#cameraArea {

    display:none;

}


.cameraBox {

    position:relative;

    overflow:hidden;

    margin-top:20px;

    background:#000;

    border-radius:20px;

}


video {

    display:block;

    width:100%;

    height:auto;

}


.scanOverlay {

    position:absolute;

    left:17%;

    top:50%;

    width:66%;

    aspect-ratio:1/1;

    transform:
        translateY(-50%);

    border:
        3px solid white;

    border-radius:18px;

    box-shadow:
        0 0 0 999px
        rgba(0,0,0,.26);

    pointer-events:none;

}


.corner {

    position:absolute;

    width:30px;

    height:30px;

}


canvas {

    display:none;

}


#resultado {

    margin-top:18px;

}


.status {

    padding:
        13px 15px;

    border-radius:13px;

    font-size:13px;

    line-height:1.5;

}


.status.ok {

    background:#eaf7ee;

    color:#16803c;

}


.status.error {

    background:#fff0ef;

    color:#c62828;

}


.offerCard {

    margin-top:18px;

    padding:22px;

    border-radius:18px;

    background:#f5f5f5;

    text-align:center;

}


.offerIcon {

    width:55px;

    height:55px;

    margin:
        0 auto
        12px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:#eaf7ee;

    font-size:25px;

}


.offerState {

    color:#16803c;

    font-size:20px;

    font-weight:900;

}


.offerRestaurant {

    margin-top:16px;

    font-size:18px;

    font-weight:800;

}


.offerText {

    margin-top:8px;

    font-size:22px;

    font-weight:900;

}


.offerCode {

    margin-top:18px;

    padding:
        12px 14px;

    background:white;

    border-radius:12px;

    font-size:16px;

    font-weight:bold;

}


.visit {

    margin-top:12px;

    color:#666;

    font-size:14px;

}


.hidden {

    display:none !important;

}


.footer {

    margin-top:22px;

    text-align:center;

    color:#666;

    font-size:10px;

    letter-spacing:.7px;

}


</style>

</head>


<body>


<div class="app">


    <div class="top">

        <div class="brand">

            🔥 TugaTrendz

        </div>


        <div class="partner">

            PARTNERS

        </div>

    </div>



    <div
        id="nomeRestaurante"
        class="restaurant">

        Portal de parceiros

    </div>



    <div class="card">


        <!-- LOGIN -->


        <div id="loginArea">


            <div class="sectionTitle">

                Acesso ao scanner

            </div>


            <div class="sectionSub">

                Introduz o PIN
                atribuído ao restaurante.

            </div>


            <input

                id="pin"

                type="password"

                inputmode="numeric"

                autocomplete="off"

                placeholder="PIN"

            >


            <button
                id="botaoEntrar"
                onclick="entrar()">

                ENTRAR

            </button>


        </div>



        <!-- SCANNER -->


        <div id="cameraArea">


            <div class="sectionTitle">

                Ler oferta

            </div>


            <div class="sectionSub">

                Aponta a câmara para
                o QR Code apresentado
                pelo cliente.

            </div>


            <button
                id="botaoAbrir"
                onclick="abrirCamara()">

                📷 ABRIR CÂMARA

            </button>



            <div
                id="cameraBox"
                class="cameraBox hidden">

                <video

                    id="video"

                    autoplay

                    muted

                    playsinline>

                </video>


                <div class="scanOverlay"></div>

            </div>


            <canvas id="canvas"></canvas>


        </div>



        <div id="resultado"></div>


    </div>



    <div class="footer">

        TUGATRENDZ PARTNERS ·
        SISTEMA DE VALIDAÇÃO

    </div>


</div>



<script>


// ========================================================
// CONFIGURAÇÃO
// ========================================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyIH5DXiwubtkRrscwGybkECxhBHI6FSabCt4p8-1EjD3EIfZE93hq2wWfkKJL-e_mrUQ/exec";



// ========================================================
// RESTAURANTE
// ========================================================

const parametros =
    new URLSearchParams(
        location.search
    );


const restauranteId =
    parametros.get(
        "restaurante"
    ) || "R001";



// ========================================================
// ESTADO
// ========================================================

let pinRestaurante =
    localStorage.getItem(

        "tugatrendz_pin_" +
        restauranteId

    );


let stream = null;

let cameraAberta = false;

let detecaoAtiva = false;

let processamento = false;

let codigoAtual = null;

let frameId = null;

let ultimoFrame = 0;

let ultimoQr = "";

let ultimoQrTempo = 0;


const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );



// ========================================================
// JSONP
// ========================================================

function jsonp(params) {

    return new Promise(

        function(
            resolve,
            reject
        ) {


            const callback =

                "tg_" +

                Date.now() +

                "_" +

                Math.floor(
                    Math.random() *
                    100000
                );


            const script =
                document.createElement(
                    "script"
                );


            let finished =
                false;


            const timeout =
                setTimeout(

                    function() {


                        if (
                            finished
                        ) {
                            return;
                        }


                        finished =
                            true;


                        cleanup();


                        reject(
                            new Error(
                                "Timeout"
                            )
                        );


                    },

                    15000

                );



            function cleanup() {


                clearTimeout(
                    timeout
                );


                try {

                    delete window[
                        callback
                    ];

                }
                catch(e) {}


                if (
                    script.parentNode
                ) {

                    script
                        .parentNode
                        .removeChild(
                            script
                        );

                }

            }



            window[
                callback
            ] = function(data) {


                if (
                    finished
                ) {
                    return;
                }


                finished =
                    true;


                cleanup();


                resolve(
                    data
                );

            };



            const query =
                new URLSearchParams(
                    params
                );


            query.set(
                "callback",
                callback
            );


            query.set(
                "_",
                Date.now()
            );


            script.src =

                APPS_SCRIPT_URL +

                "?" +

                query.toString();


            script.onerror =
                function() {


                    if (
                        finished
                    ) {
                        return;
                    }


                    finished =
                        true;


                    cleanup();


                    reject(
                        new Error(
                            "Ligação"
                        )
                    );

                };


            document.body
                .appendChild(
                    script
                );

        }

    );

}



// ========================================================
// LOGIN
// ========================================================

async function entrar() {


    const pin =

        document
            .getElementById(
                "pin"
            )
            .value
            .trim();


    if (!pin) {

        erroGeral(
            "Introduz o PIN."
        );

        return;

    }


    const botao =
        document
            .getElementById(
                "botaoEntrar"
            );


    botao.disabled =
        true;


    status(
        "A validar acesso...",
        ""
    );


    try {


        const resposta =
            await jsonp({

                api:"pin",

                restaurante:
                    restauranteId,

                pin:pin

            });



        if (
            !resposta.ok
        ) {


            erroGeral(
                resposta.mensagem ||
                "PIN inválido."
            );


            botao.disabled =
                false;


            return;

        }


        pinRestaurante =
            pin;


        localStorage.setItem(

            "tugatrendz_pin_" +
            restauranteId,

            pin

        );


        entrarScanner(
            resposta.restaurante
        );


    }

    catch(e) {


        console.error(e);


        erroGeral(

            "Não foi possível " +
            "ligar ao sistema."

        );


        botao.disabled =
            false;

    }

}



// ========================================================
// RECUPERAR SESSÃO
// ========================================================

async function recuperarSessao() {


    if (
        !pinRestaurante
    ) {

        return;

    }


    try {


        const resposta =
            await jsonp({

                api:"pin",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante

            });



        if (
            !resposta.ok
        ) {


            localStorage
                .removeItem(

                    "tugatrendz_pin_" +
                    restauranteId

                );


            pinRestaurante =
                null;


            return;

        }


        entrarScanner(
            resposta.restaurante
        );


    }

    catch(e) {

        console.error(e);

    }

}



// ========================================================
// ABRIR ÁREA SCANNER
// ========================================================

function entrarScanner(
    restaurante
) {


    document
        .getElementById(
            "nomeRestaurante"
        )
        .textContent =
        restaurante;


    document
        .getElementById(
            "loginArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "cameraArea"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "resultado"
        )
        .innerHTML =
        "";

}



// ========================================================
// CÂMARA
// ========================================================

async function abrirCamara() {


    if (
        cameraAberta &&
        stream &&
        stream.active
    ) {


        processamento =
            false;


        detecaoAtiva =
            true;


        document
            .getElementById(
                "cameraBox"
            )
            .classList
            .remove(
                "hidden"
            );


        document
            .getElementById(
                "botaoAbrir"
            )
            .classList
            .add(
                "hidden"
            );


        iniciarLoop();


        return;

    }


    status(
        "A abrir a câmara...",
        ""
    );


    try {


        stream =

            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{

                        facingMode:{
                            ideal:
                            "environment"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        }

                    }

                });


        video.srcObject =
            stream;


        await video.play();


        cameraAberta =
            true;


        detecaoAtiva =
            true;


        processamento =
            false;


        document
            .getElementById(
                "botaoAbrir"
            )
            .classList
            .add(
                "hidden"
            );


        document
            .getElementById(
                "cameraBox"
            )
            .classList
            .remove(
                "hidden"
            );


        status(

            "Câmara pronta. " +
            "Aponta para o QR Code.",

            "ok"

        );


        iniciarLoop();


    }

    catch(e) {


        console.error(e);


        let mensagem =

            "Não foi possível " +
            "abrir a câmara.";


        if (
            e.name ===
            "NotAllowedError"
        ) {


            mensagem =

                "O acesso à câmara " +
                "não foi autorizado.";

        }


        else if (
            e.name ===
            "NotReadableError"
        ) {


            mensagem =

                "A câmara está a ser " +
                "utilizada por outra aplicação.";

        }


        else if (
            e.name ===
            "NotFoundError"
        ) {


            mensagem =

                "Não foi encontrada " +
                "nenhuma câmara.";

        }


        erroGeral(
            mensagem
        );

    }

}



// ========================================================
// LOOP
// ========================================================

function iniciarLoop() {


    if (
        frameId
    ) {


        cancelAnimationFrame(
            frameId
        );


        frameId =
            null;

    }



    function loop(
        timestamp
    ) {


        if (
            !cameraAberta ||
            !stream
        ) {

            return;

        }


        if (
            timestamp -
            ultimoFrame
            >= 140
        ) {


            ultimoFrame =
                timestamp;


            if (
                detecaoAtiva &&
                !processamento &&
                video.readyState >= 2 &&
                video.videoWidth > 0
            ) {


                analisar();

            }

        }


        frameId =
            requestAnimationFrame(
                loop
            );

    }


    frameId =
        requestAnimationFrame(
            loop
        );

}



// ========================================================
// ANALISAR QR
// ========================================================

function analisar() {


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    ctx.drawImage(

        video,

        0,
        0,

        canvas.width,
        canvas.height

    );


    const imagem =
        ctx.getImageData(

            0,
            0,

            canvas.width,
            canvas.height

        );


    const qr =
        jsQR(

            imagem.data,

            imagem.width,

            imagem.height,

            {
                inversionAttempts:
                    "attemptBoth"
            }

        );


    if (
        !qr ||
        !qr.data
    ) {

        return;

    }


    const agora =
        Date.now();


    if (
        qr.data ===
        ultimoQr &&

        agora -
        ultimoQrTempo <
        3000
    ) {

        return;

    }


    ultimoQr =
        qr.data;


    ultimoQrTempo =
        agora;


    processarQR(
        qr.data
    );

}



// ========================================================
// PROCESSAR
// ========================================================

async function processarQR(
    texto
) {


    if (
        processamento
    ) {

        return;

    }


    processamento =
        true;


    detecaoAtiva =
        false;


    status(
        "A validar oferta...",
        ""
    );


    const codigo =
        extrairCodigo(
            texto
        );


    if (
        !codigo
    ) {


        erroScan(

            "Este QR Code " +
            "não pertence à TugaTrendz."

        );


        return;

    }


    codigoAtual =
        codigo;


    try {


        const resposta =
            await jsonp({

                api:"validar",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante,

                codigo:
                    codigo

            });



        if (
            !resposta.ok
        ) {


            erroScan(

                resposta.mensagem ||
                "Oferta inválida."

            );


            return;

        }


        mostrarOferta(
            resposta
        );


    }

    catch(e) {


        console.error(e);


        erroScan(

            "Não foi possível " +
            "validar a oferta."

        );

    }

}



// ========================================================
// EXTRAIR CÓDIGO
// ========================================================

function extrairCodigo(
    texto
) {


    const valor =
        String(
            texto || ""
        )
        .trim();


    const match =
        valor.match(
            /TGT-[A-Z0-9]+/i
        );


    if (
        match
    ) {


        return match[0]
            .toUpperCase();

    }


    try {


        const url =
            new URL(
                valor
            );


        const codigo =
            url.searchParams
                .get(
                    "codigo"
                );


        if (
            codigo
        ) {


            return codigo
                .trim()
                .toUpperCase();

        }

    }

    catch(e) {}


    return null;

}



// ========================================================
// MOSTRAR OFERTA
// ========================================================

function mostrarOferta(
    dados
) {


    document
        .getElementById(
            "resultado"
        )
        .innerHTML = `

        <div class="offerCard">


            <div class="offerIcon">

                ✓

            </div>


            <div class="offerState">

                OFERTA VÁLIDA

            </div>


            <div class="offerRestaurant">

                ${escapeHtml(
                    dados.restaurante
                )}

            </div>


            <div class="offerText">

                🎁 ${escapeHtml(
                    dados.oferta
                )}

            </div>


            <div class="offerCode">

                ${escapeHtml(
                    dados.codigo
                )}

            </div>


            <button
                class="green"
                onclick="confirmarUtilizacao()">

                CONFIRMAR UTILIZAÇÃO

            </button>


            <button
                class="secondary"
                onclick="proximoQR()">

                CANCELAR / LER OUTRO

            </button>


        </div>

    `;

}



// ========================================================
// CONFIRMAR
// ========================================================

async function confirmarUtilizacao() {


    if (
        !codigoAtual
    ) {

        return;

    }


    status(
        "A registar utilização...",
        ""
    );


    try {


        const resposta =
            await jsonp({

                api:"utilizar",

                restaurante:
                    restauranteId,

                pin:
                    pinRestaurante,

                codigo:
                    codigoAtual

            });



        if (
            !resposta.ok
        ) {


            erroScan(

                resposta.mensagem ||
                "Não foi possível registar."

            );


            return;

        }


        document
            .getElementById(
                "resultado"
            )
            .innerHTML = `

            <div class="offerCard">


                <div class="offerIcon">

                    ✓

                </div>


                <div class="offerState">

                    UTILIZAÇÃO CONFIRMADA

                </div>


                <div class="offerRestaurant">

                    ${escapeHtml(
                        resposta.restaurante
                    )}

                </div>


                <div class="visit">

                    Visita #${escapeHtml(
                        resposta.visita
                    )}

                </div>


                <div class="offerCode">

                    ${escapeHtml(
                        resposta.codigo
                    )}

                </div>


                <button
                    onclick="proximoQR()">

                    📷 LER PRÓXIMO QR

                </button>


            </div>

        `;


    }

    catch(e) {


        console.error(e);


        erroScan(

            "Não foi possível " +
            "registar a utilização."

        );

    }

}



// ========================================================
// PRÓXIMO
// ========================================================

function proximoQR() {


    codigoAtual =
        null;


    processamento =
        false;


    detecaoAtiva =
        true;


    ultimoQr =
        "";


    ultimoQrTempo =
        0;


    status(

        "Pronto para o próximo QR.",

        "ok"

    );

}



// ========================================================
// STATUS
// ========================================================

function status(
    mensagem,
    tipo
) {


    const classe =

        tipo === "ok"

        ? "status ok"

        : "status";


    document
        .getElementById(
            "resultado"
        )
        .innerHTML =

        '<div class="' +
        classe +
        '">' +

        escapeHtml(
            mensagem
        ) +

        '</div>';

}



// ========================================================
// ERRO SCAN
// ========================================================

function erroScan(
    mensagem
) {


    document
        .getElementById(
            "resultado"
        )
        .innerHTML = `

        <div class="offerCard">

            <div
                class="status error">

                ${escapeHtml(
                    mensagem
                )}

            </div>


            <button
                class="secondary"
                onclick="proximoQR()">

                📷 LER OUTRO QR

            </button>

        </div>

    `;

}



// ========================================================
// ERRO
// ========================================================

function erroGeral(
    mensagem
) {


    document
        .getElementById(
            "resultado"
        )
        .innerHTML =

        '<div class="status error">' +

        escapeHtml(
            mensagem
        ) +

        '</div>';

}



// ========================================================
// ESCAPAR
// ========================================================

function escapeHtml(
    texto
) {


    return String(

        texto === undefined ||
        texto === null

        ? ""

        : texto

    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



// ========================================================
// FECHAR CÂMARA AO SAIR
// ========================================================

window.addEventListener(

    "pagehide",

    function() {


        if (
            !stream
        ) {

            return;

        }


        stream
            .getTracks()
            .forEach(

                function(
                    track
                ) {

                    track.stop();

                }

            );

    }

);



// ========================================================
// INICIAR
// ========================================================

recuperarSessao();


</script>

</body>
</html>
